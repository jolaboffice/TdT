# conda env create -f environment.yml && conda activate hdom
# maligner_dp is not on conda; build it from source and put it on PATH (see README).
name: hdom
channels: [conda-forge]
dependencies:
  - python>=3.9
  - numpy>=1.21,<2
  - scipy>=1.7
  - pandas>=1.3
  - tifffile>=2021.7
  - pillow>=9.0
  - scikit-learn>=1.0
  - joblib>=1.1
  - numba>=0.55
  - matplotlib>=3.4
  # requires an NVIDIA GPU; pick the build matching your CUDA runtime
  - cupy
